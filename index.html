<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alam - Graphic Designer Portfolio 2026</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap"
    rel="stylesheet">

  <!-- React 18, ReactDOM 18, and Babel Standalone for Seamless Client-Side React Rendering -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      width: 100%;
      background-color: #000000;
      overflow-x: hidden;
      position: relative;
    }

    /* Fixed Canvas background animation */
    #animationCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      pointer-events: none;
    }

    /* Background overlay vignette */
    .bg-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.45) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* Loader */
    .loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      pointer-events: none;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: #ffffff;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .progress-bar-wrap {
      width: clamp(180px, 40vw, 260px);
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d62828, #ff3344);
      transition: width 0.15s ease-out;
      box-shadow: 0 0 12px rgba(214, 40, 40, 0.8);
    }

    .loader-percentage {
      margin-top: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #9090a0;
      letter-spacing: 1px;
    }

    /* Logo Fixed Top Left */
    .logo-fixed {
      position: fixed;
      top: 24px;
      left: 28px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(10, 10, 16, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .logo-fixed:hover {
      transform: scale(1.08);
      background: rgba(20, 20, 30, 0.95);
      border-color: rgba(214, 40, 40, 0.8);
      box-shadow: 0 0 20px rgba(214, 40, 40, 0.4);
    }

    .logo-fixed img {
      width: clamp(32px, 5vw, 42px);
      height: clamp(32px, 5vw, 42px);
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.3));
    }

    /* Scrollable Container covering Sections */
    .scroll-container {
      position: relative;
      z-index: 10;
    }

    .section {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: clamp(60px, 10vh, 100px) clamp(16px, 4vw, 40px);
      position: relative;
    }

    /* Glassmorphic Panel Style */
    .glass-panel {
      background: rgba(10, 10, 16, 0.28) !important;
      backdrop-filter: blur(10px) !important;
      -webkit-backdrop-filter: blur(10px) !important;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: clamp(16px, 3vw, 24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 1100px;
      padding: clamp(20px, 4vw, 40px);
    }

    /* Section 1: Hero */
    #hero {
      justify-content: center;
    }

    .hero-content {
      display: flex;
      align-items: center;
      gap: clamp(24px, 5vw, 48px);
      max-width: 900px;
      width: 100%;
    }

    @keyframes heroBorderGlow {
      0% {
        background-position: 0% 50%;
        box-shadow: 0 10px 30px rgba(214, 40, 40, 0.5);
      }

      50% {
        background-position: 100% 50%;
        box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5);
      }

      100% {
        background-position: 0% 50%;
        box-shadow: 0 10px 30px rgba(214, 40, 40, 0.5);
      }
    }

    .hero-avatar-pill {
      background: linear-gradient(135deg, #d62828, #ff3344, #3b82f6, #900c1e, #d62828);
      background-size: 300% 300%;
      animation: heroBorderGlow 4s ease infinite;
      border-radius: 48px 48px 20px 48px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hero-avatar-pill:hover {
      transform: scale(1.04) translateY(-4px);
      box-shadow: 0 18px 45px rgba(214, 40, 40, 0.75);
    }

    .hero-avatar-pill img {
      width: clamp(140px, 35vw, 200px);
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 44px 44px 16px 44px;
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 9vw, 5.5rem);
      letter-spacing: 2px;
      line-height: 0.95;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #b0b0c0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px;
    }

    .hero-title span {
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      color: #9090a0;
      -webkit-text-fill-color: initial;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      letter-spacing: 2px;
      font-weight: 600;
      width: fit-content;
      margin-top: 4px;
    }

    .hero-badge-square {
      width: 8px;
      height: 8px;
      background: #ffffff;
    }

    /* Hide default cursor on desktop when custom cursor is active */
    @media (pointer: fine) {

      body,
      a,
      button,
      input,
      textarea,
      select,
      [role="button"] {
        cursor: none !important;
      }
    }

    /* Smooth Custom Cursor Elements */
    .custom-cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s ease;
    }

    .custom-cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      width: 36px;
      height: 36px;
      border: 1.5px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.25s ease, height 0.25s ease, background 0.25s ease, border-color 0.25s ease, opacity 0.3s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(2px);
    }

    .custom-cursor-ring.hovered {
      width: 56px;
      height: 56px;
      background: rgba(214, 40, 40, 0.25);
      border-color: rgba(214, 40, 40, 0.8);
      box-shadow: 0 0 20px rgba(214, 40, 40, 0.4);
    }

    .hero-menu {
      display: flex;
      gap: 14px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .hero-menu a {
      color: #ffffff;
      text-decoration: none;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      letter-spacing: 3px;
      font-weight: 700;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hero-menu a:hover {
      color: #ffffff;
      background: #d62828;
      border-color: #d62828;
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(214, 40, 40, 0.4);
    }

    /* Top Nav Pills */
    .nav-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      width: 100%;
    }

    .nav-pill {
      padding: 8px 18px;
      border-radius: 30px;
      font-size: clamp(0.65rem, 1.8vw, 0.75rem);
      font-weight: 700;
      letter-spacing: 1.5px;
      text-decoration: none;
      color: #808090;
      background: rgba(20, 20, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-pill.active {
      background: #2b70e4;
      color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    /* Section 2: Profile & About Me */
    .profile-grid {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: clamp(20px, 4vw, 40px);
      align-items: start;
    }

    .profile-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .profile-left-tag {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: #9090a0;
      margin-bottom: 4px;
    }

    .profile-name {
      font-family: 'Bebas Neue', 'Syne', sans-serif;
      font-size: clamp(1.8rem, 5.5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1;
      margin-bottom: 16px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .profile-image-frame {
      width: clamp(180px, 45vw, 240px);
      aspect-ratio: 3 / 4;
      height: auto;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .profile-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .profile-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-heading {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      letter-spacing: 1px;
      color: #ffffff;
    }

    .about-text {
      font-size: clamp(0.75rem, 1.8vw, 0.82rem);
      line-height: 1.6;
      color: #b0b0c0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .skills-header {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.3rem, 3vw, 1.6rem);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .skills-icons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .skill-badge {
      width: clamp(38px, 6vw, 44px);
      height: clamp(38px, 6vw, 44px);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .skill-badge:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.2);
    }

    .skill-ps {
      background: #001e36;
      color: #31a8ff;
      border: 1px solid #00509d;
    }

    .skill-ai {
      background: #331400;
      color: #ff7700;
      border: 1px solid #cc5500;
    }

    .skill-cd {
      background: #002611;
      color: #00e66b;
      border: 1px solid #009947;
    }

    .skill-id {
      background: #33001b;
      color: #ff3399;
      border: 1px solid #cc0066;
    }

    .skill-pp {
      background: #331000;
      color: #ff5500;
      border: 1px solid #cc3300;
    }

    .skill-fg {
      background: #1e1e1e;
      color: #a259ff;
      border: 1px solid #555566;
    }

    .skill-pr {
      background: #000040;
      color: #9999ff;
      border: 1px solid #3333cc;
    }

    .skill-ae {
      background: #1a0033;
      color: #d999ff;
      border: 1px solid #7700cc;
    }

    .info-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
    }

    .info-box-title {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #e0e0f0;
      margin-bottom: 6px;
    }

    .info-box-desc {
      font-size: 0.72rem;
      color: #9090a0;
      line-height: 1.4;
    }

    .language-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lang-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #b0b0c0;
      letter-spacing: 1px;
    }

    /* Section 3: Project Recap */
    .recap-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 20px;
    }

    .recap-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: 2px;
    }

    .recap-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      font-weight: 700;
      color: #9090a0;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    .project-card {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(15, 15, 25, 0.8);
      aspect-ratio: 3 / 4;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: rgba(214, 40, 40, 0.6);
      box-shadow: 0 12px 30px rgba(214, 40, 40, 0.3);
    }

    .project-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .project-card:hover img {
      transform: scale(1.06);
    }

    .project-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.2) 65%);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .project-card-title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 700;
      color: #ffffff;
    }

    .project-card-sub {
      font-size: 0.7rem;
      color: #a0a0b0;
      margin-top: 2px;
    }

    /* Modal / Lightbox */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeIn 0.25s ease-out;
    }

    .lightbox-modal {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
      background: #0a0a10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .lightbox-modal img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-footer {
      width: 100%;
      padding: 14px 20px;
      background: rgba(15, 15, 25, 0.95);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10001;
      transition: background 0.2s, transform 0.2s;
    }

    .lightbox-close:hover {
      background: #d62828;
      transform: scale(1.1);
    }

    .lightbox-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(10, 10, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #ffffff;
      font-size: 1.8rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10001;
      transition: all 0.2s ease;
    }

    .lightbox-nav-btn:hover {
      background: #d62828;
      border-color: #ffffff;
      transform: translateY(-50%) scale(1.1);
    }

    .nav-prev {
      left: 16px;
    }

    .nav-next {
      right: 16px;
    }

    .lightbox-indicators {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 6px;
      z-index: 10001;
    }

    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .indicator-dot.active {
      width: 24px;
      border-radius: 10px;
      background: #d62828;
      box-shadow: 0 0 10px rgba(214, 40, 40, 0.6);
    }

    /* Section 4: Services & Pricing */
    .services-intro {
      font-size: clamp(0.82rem, 1.8vw, 0.92rem);
      color: #b0b0c0;
      line-height: 1.6;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(20px, 4vw, 36px);
      align-items: start;
      width: 100%;
    }

    .services-list-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.4rem, 3vw, 1.8rem);
      letter-spacing: 1px;
      margin-bottom: 14px;
      color: #ffffff;
    }

    .services-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .service-chip {
      background: rgba(255, 255, 255, 0.025) !important;
      backdrop-filter: blur(6px) !important;
      -webkit-backdrop-filter: blur(6px) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #e0e0f0;
      letter-spacing: 0.5px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .service-chip:hover {
      background: rgba(214, 40, 40, 0.28) !important;
      border-color: rgba(214, 40, 40, 0.8) !important;
      color: #ffffff !important;
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 8px 20px rgba(214, 40, 40, 0.4);
    }

    .pricing-cards {
      display: grid;

<body>
  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- React 18 Application Logic -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const FRAME_COUNT = 240;

    // Helper to format frame URLs
    function getFrameUrl(index) {
      const paddedIndex = String(index).padStart(3, '0');
      return `ezgif-frame-${paddedIndex}.jpg`;
    }

    // 1. Custom Smooth Lerp Cursor Component
    function CustomCursor() {
      const dotRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;
        let animationFrameId;

        const onMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
          }
        };

        const updateRing = () => {
          ringX += (mouseX - ringX) * 0.22; // High-speed responsive lerp
          ringY += (mouseY - ringY) * 0.22;
          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
          }
          animationFrameId = requestAnimationFrame(updateRing);
        };

        window.addEventListener('mousemove', onMouseMove, { passive: true });
        animationFrameId = requestAnimationFrame(updateRing);

        // Hover handlers for interactive elements
        const handleMouseEnter = () => ringRef.current && ringRef.current.classList.add('hovered');
        const handleMouseLeave = () => ringRef.current && ringRef.current.classList.remove('hovered');

        const selectors = 'a, button, .project-card, .nav-pill, .logo-fixed, .service-chip, .pricing-card, .skill-badge, .social-item, .service-btn-chip, .btn-submit';
        const interactiveElements = document.querySelectorAll(selectors);

        interactiveElements.forEach(el => {
          el.addEventListener('mouseenter', handleMouseEnter);
          el.addEventListener('mouseleave', handleMouseLeave);
        });

        return () => {
          window.removeEventListener('mousemove', onMouseMove);
          cancelAnimationFrame(animationFrameId);
          interactiveElements.forEach(el => {
            el.removeEventListener('mouseenter', handleMouseEnter);
            el.removeEventListener('mouseleave', handleMouseLeave);
          });
        };
      }, []);

      return (
        <React.Fragment>
          <div className="custom-cursor-dot" ref={dotRef}></div>
          <div className="custom-cursor-ring" ref={ringRef}></div>
        </React.Fragment>
      );
    }

    // 2. High-Performance Canvas Scroll Engine Component
    function CanvasBackground({ onProgress, onLoaded }) {
      const canvasRef = useRef(null);
      const imagesRef = useRef([]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let cssWidth = window.innerWidth;
        let cssHeight = window.innerHeight;
        let dpr = window.devicePixelRatio || 1;

        let targetFrameIndex = 0;
        let currentFrameIndex = 0;
        let lastRenderedIndex = -1;

        function resizeCanvas() {
          cssWidth = window.innerWidth;
          cssHeight = window.innerHeight;
          dpr = window.devicePixelRatio || 1;

          canvas.width = Math.floor(cssWidth * dpr);
          canvas.height = Math.floor(cssHeight * dpr);
          canvas.style.width = cssWidth + 'px';
          canvas.style.height = cssHeight + 'px';

          renderFrame(Math.round(currentFrameIndex));
        }

        function drawFrame(img) {
          if (!img || !img.complete || img.naturalWidth === 0) return;

          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const imgAspect = img.naturalWidth / img.naturalHeight;
          const canvasAspect = cssWidth / cssHeight;

          let drawWidth, drawHeight, offsetX, offsetY;

          if (canvasAspect > imgAspect) {
            drawWidth = cssWidth;
            drawHeight = cssWidth / imgAspect;
          } else {
            drawHeight = cssHeight;
            drawWidth = cssHeight * imgAspect;
          }

          offsetX = (cssWidth - drawWidth) / 2;
          offsetY = (cssHeight - drawHeight) / 2;

          ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
        }

        function renderFrame(index) {
          const safeIndex = Math.min(FRAME_COUNT - 1, Math.max(0, index));
          if (imagesRef.current[safeIndex]) {
            drawFrame(imagesRef.current[safeIndex]);
            lastRenderedIndex = safeIndex;
          }
        }

        function updateScrollProgress() {
          const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
          const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
          const scrollFraction = Math.min(1, Math.max(0, scrollTop / maxScroll));

          targetFrameIndex = scrollFraction * (FRAME_COUNT - 1);
        }

        function animate() {
          updateScrollProgress();

          // Optimized smooth lerp factor (0.22 for fast, liquid response)
          currentFrameIndex += (targetFrameIndex - currentFrameIndex) * 0.22;

          const roundedIndex = Math.round(currentFrameIndex);
          if (roundedIndex !== lastRenderedIndex) {
            renderFrame(roundedIndex);
          }

          animationFrameId = requestAnimationFrame(animate);
        }

        // Image Preloading Engine
        let loadedCount = 0;
        const images = [];

        function onFrameLoaded() {
          loadedCount++;
          const percentage = Math.min(100, Math.round((loadedCount / FRAME_COUNT) * 100));
          if (onProgress) onProgress(percentage);

          if (loadedCount === 1) {
            renderFrame(0);
          }

          if (loadedCount >= FRAME_COUNT) {
            if (onLoaded) onLoaded();
          }
        }

        for (let i = 1; i <= FRAME_COUNT; i++) {
          const img = new Image();
          img.onload = onFrameLoaded;
          img.onerror = onFrameLoaded;
          img.src = getFrameUrl(i);
          images.push(img);
        }

        imagesRef.current = images;

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('scroll', updateScrollProgress, { passive: true });

        resizeCanvas();
        animationFrameId = requestAnimationFrame(animate);

        // Fallback loader dismiss
        const fallbackTimer = setTimeout(() => {
          if (onLoaded) onLoaded();
        }, 2200);

        return () => {
          window.removeEventListener('resize', resizeCanvas);
          window.removeEventListener('scroll', updateScrollProgress);
          cancelAnimationFrame(animationFrameId);
          clearTimeout(fallbackTimer);
        };
      }, []);

      return (
        <React.Fragment>
          <canvas id="animationCanvas" ref={canvasRef}></canvas>
          <div className="bg-vignette"></div>
        </React.Fragment>
      );
    }

            </div>
          </div>

    }

    // 5. Profile & About Me Component
    function ProfileSection({ activeSection, scrollTo }) {
      return (
        <section className="section" id="profil">
          <NavPills activeSection={activeSection} scrollTo={scrollTo} />

          <div className="glass-panel">
            <div className="profile-grid">
              <div className="profile-left">
                <span className="profile-left-tag">HELLO, I AM</span>
                <h3 className="profile-name">ALAM</h3>
                <div className="profile-image-frame">
                  <img src="avatar.png" alt="Alam" />
                </div>
              </div>

              <div className="profile-right">
                <h2 className="section-heading">ABOUT ME</h2>
                <p className="about-text">
                  HI, I'M ALAM. I HAVE 3 YEARS OF EXPERIENCE IN THE GRAPHIC DESIGN FIELD. I LEARNED A LOT OF
                  THINGS FROM EDITING, GRAPHIC DESIGN, VIDEO, TYPOGRAPHY, BRANDING, AND VISUAL CREATIVE DESIGN.
                </p>

                <div>

    // 10. Lightbox Modal Component with Multi-Image Gallery Support
    function LightboxModal({ modalItem, onClose }) {
      const images = modalItem.images && modalItem.images.length > 0 ? modalItem.images : [modalItem.img];
      const [currentIndex, setCurrentIndex] = useState(0);

      const nextImg = (e) => {
        if (e) e.stopPropagation();
        setCurrentIndex((prev) => (prev + 1) % images.length);
      };

      const prevImg = (e) => {
        if (e) e.stopPropagation();
        setCurrentIndex((prev) => (prev - 1 + images.length) % images.length);
      };

      return (
        <div className="lightbox-backdrop" onClick={onClose}>
          <div className="lightbox-modal" onClick={e => e.stopPropagation()}>
            <button className="lightbox-close" onClick={onClose}>✕</button>
            <div style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', width: '100%', minHeight: '280px' }}>
              <img
                src={images[currentIndex]}
                alt={modalItem.title}
                onError={(e) => { e.target.onerror = null; e.target.src = 'poster1.jpg'; }}
              />

              {images.length > 1 && (
                <React.Fragment>
                  <button className="lightbox-nav-btn nav-prev" onClick={prevImg} title="Previous image">‹</button>
                  <button className="lightbox-nav-btn nav-next" onClick={nextImg} title="Next image">›</button>
                  <div className="lightbox-indicators">
                    {images.map((_, idx) => (
                      <span
                        key={idx}
                        className={`indicator-dot ${idx === currentIndex ? 'active' : ''}`}
                        onClick={(e) => { e.stopPropagation(); setCurrentIndex(idx); }}
                      />
                    ))}
                  </div>
                </React.Fragment>
              )}
            </div>

            <div className="lightbox-footer">
              <div>
                <h3 style={{ fontFamily: 'Syne', fontSize: '1.1rem', color: '#ffffff' }}>{modalItem.title}</h3>
                <p style={{ fontSize: '0.75rem', color: '#9090a0' }}>
                  {modalItem.sub} {images.length > 1 ? `(${currentIndex + 1} of ${images.length})` : ''}
                </p>
              </div>
              <span style={{ fontSize: '0.7rem', background: '#d62828', padding: '4px 10px', borderRadius: '4px', fontWeight: '700' }}>2026 EDITION</span>
            </div>
          </div>
        </div>
      );
    }

    // Main React Application Component
    function App() {
      const [loading, setLoading] = useState(true);
      const [progress, setProgress] = useState(0);
      const [activeSection, setActiveSection] = useState('profil');
      const [modalItem, setModalItem] = useState(null);

      const scrollTo = useCallback((id) => {
        const el = document.getElementById(id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth' });
        }
      }, []);

      // Active Section Observer on Scroll
      useEffect(() => {
        const sectionIds = ['profil', 'project', 'services', 'contact'];
        const elements = sectionIds.map(id => document.getElementById(id)).filter(Boolean);

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              setActiveSection(entry.target.id);
            }
          });
        }, { threshold: 0.3 });

        elements.forEach(el => observer.observe(el));

        return () => observer.disconnect();
      }, []);

      return (
        <React.Fragment>
          {/* Custom Cursor */}
          <CustomCursor />

          {/* Canvas Smooth Frame Sequence Engine */}
          <CanvasBackground
            onProgress={setProgress}
            onLoaded={() => setLoading(false)}
          />

          {/* Loader Overlay */}
          <div className={`loader ${!loading ? 'hidden' : ''}`}>
            <div className="loader-title">LOADING PORTFOLIO</div>
            <div className="progress-bar-wrap">
              <div className="progress-bar" style={{ width: `${progress}%` }}></div>
            </div>
            <div className="loader-percentage">{progress}%</div>
          </div>

          {/* Fixed Logo Top Left */}
          <div className="logo-fixed" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} title="Alam">
            <img src="logo_white.png" alt="TD Logo" />
          </div>

          {/* Scrollable Main Content */}
          <div className="scroll-container">
            <HeroSection scrollTo={scrollTo} />
            <ProfileSection activeSection={activeSection} scrollTo={scrollTo} />
            <ProjectSection activeSection={activeSection} scrollTo={scrollTo} onOpenModal={setModalItem} />
            <ServicesSection activeSection={activeSection} scrollTo={scrollTo} />
            <ContactSection activeSection={activeSection} scrollTo={scrollTo} />
          </div>

          {/* Poster Image Lightbox Modal with Multi-Image Support */}
          {modalItem && (
            <LightboxModal modalItem={modalItem} onClose={() => setModalItem(null)} />
          )}
        </React.Fragment>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
